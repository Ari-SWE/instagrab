services:
  - type: web
    name: instagrab-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: UPSTREAM_BASE_URL
        value: https://insta-stories-viewer.com
      - key: CACHE_TTL_SECONDS
        value: 300
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 30
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PUPPETEER_HEADLESS
        value: "true"
      - key: PUPPETEER_TIMEOUT
        value: "30000"
